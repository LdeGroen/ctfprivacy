name: Deploy

on:
  push:
    branches: [master]
    # Alleen documentatie gewijzigd? Dan geen bouw en uitrol (audit INF-08).
    paths-ignore: ['**.md', 'docs/**', '.github/dependabot.yml']
  workflow_dispatch:

# De bouw- en uitrolstappen staan centraal in ctf-ui (hard falen bij een
# ontbrekend secret of een lege build, concurrency, vaste hostsleutel).
# Vastgezet op een tag: een wijziging daar raakt deze app pas bij een nieuwe tag.
jobs:
  deploy:
    uses: LdeGroen/ctf-ui/.github/workflows/deploy-site.yml@deploy-v3
    with:
      # Vite lint niet zelf (sinds 10-11-2026 Vite i.p.v. react-scripts).
      lint: true
      # Eigen sleutel, op de server beperkt tot deze map (audit INF-01).
      beperkte-sleutel: true
    secrets:
      SSH_KEY: ${{ secrets.NIEUWE_SERVER_KEY }}
      SSH_USER: ${{ secrets.NIEUWE_SERVER_USER }}
      DOEL_PAD: ${{ secrets.NIEUWE_SERVER_PAD }}
