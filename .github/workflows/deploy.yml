name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# De bouw- en uitrolstappen staan centraal in ctf-ui (hard falen bij een
# ontbrekend secret of een lege build, concurrency, vaste hostsleutel).
# Vastgezet op een tag: een wijziging daar raakt deze app pas bij een nieuwe tag.
jobs:
  deploy:
    uses: LdeGroen/ctf-ui/.github/workflows/deploy-site.yml@deploy-v1
    secrets:
      SSH_KEY: ${{ secrets.NIEUWE_SERVER_KEY }}
      SSH_USER: ${{ secrets.NIEUWE_SERVER_USER }}
      DOEL_PAD: ${{ secrets.NIEUWE_SERVER_PAD }}
